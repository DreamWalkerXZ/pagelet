name: Release

on:
  pull_request:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to retry on Docker Hub
        required: true
        type: string

permissions:
  contents: read

jobs:
  downloads:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Rust release acceptance checks
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and package the executable
        shell: bash
        run: |
          if [[ "$TARGET" == *-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            export CC=musl-gcc
          fi
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match the Cargo package version v$version" >&2
            exit 1
          fi
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET"
          mkdir -p package/web/vendor dist
          cp "target/$TARGET/release/pagelet" LICENSE THIRD_PARTY_NOTICES.md package/
          cp web/vendor/*.LICENSE package/web/vendor/
          archive="dist/pagelet-v$version-$TARGET.tar.gz"
          tar -czf "$archive" -C package pagelet LICENSE THIRD_PARTY_NOTICES.md web
          bash scripts/release-smoke.sh archive "$archive"
      - uses: actions/setup-node@v6
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          node-version: '24'
      - name: Check browser dependencies and test the release binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          PAGELET_BROWSER_BINARY: package/pagelet
        run: |
          npm ci
          npm audit --omit=dev
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v6
        with:
          name: download-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    needs: downloads
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: download-*
          path: downloads
          merge-multiple: true
      - name: Assemble a multi-platform OCI archive
        run: |
          mkdir -p context/{binaries/{amd64,arm64},data,web/vendor}
          cp Dockerfile LICENSE THIRD_PARTY_NOTICES.md context/
          cp web/vendor/*.LICENSE context/web/vendor/
          tar -xzf downloads/pagelet-*-x86_64-unknown-linux-musl.tar.gz -C context/binaries/amd64 pagelet
          tar -xzf downloads/pagelet-*-aarch64-unknown-linux-musl.tar.gz -C context/binaries/arm64 pagelet
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --output type=oci,dest=pagelet-image.oci.tar context
      - uses: actions/upload-artifact@v6
        with:
          name: pagelet-oci
          path: pagelet-image.oci.tar
          if-no-files-found: error

  image-smoke:
    needs: image
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pagelet-oci
      - name: Run the image on the matching architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --override-os linux --override-arch "$ARCH" copy \
            oci-archive:pagelet-image.oci.tar docker-daemon:pagelet:smoke
          bash scripts/release-smoke.sh image pagelet:smoke "$ARCH"

  draft:
    if: github.event_name == 'push'
    needs: [downloads, image-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: download-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: pagelet-oci
          path: dist
      - name: Create a draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum ./*.tar.gz pagelet-image.oci.tar > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Pagelet $GITHUB_REF_NAME" --notes-file docs/release-notes.md \
            dist/*.tar.gz dist/SHA256SUMS dist/pagelet-image.oci.tar

  publish-image:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: docker-hub-publication
      queue: max
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: docker://docker.io/dreamwalkerxz/pagelet
    steps:
      - name: Fetch the verified OCI archive for this release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --json isDraft,isPrerelease | jq -e '(.isDraft or .isPrerelease) | not' >/dev/null
          gh release download "$TAG" --pattern pagelet-image.oci.tar --pattern SHA256SUMS
          grep '  pagelet-image\.oci\.tar$' SHA256SUMS | sha256sum --check
          gh release view --json tagName --jq .tagName > latest-release
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Publish the verified manifests to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          skopeo copy --all --preserve-digests oci-archive:pagelet-image.oci.tar "$IMAGE:${TAG#v}"
          if [[ "$TAG" == "$(cat latest-release)" ]]; then
            skopeo copy --all --preserve-digests oci-archive:pagelet-image.oci.tar "$IMAGE:latest"
          fi
